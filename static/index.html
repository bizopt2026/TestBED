<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMS</title>
<link rel="preload" href="/static/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/palette.css">
</head>
<body>
<a class="skip" href="#view">본문으로 건너뛰기</a>
<header class="top">
  <button class="btn ghost icon side-toggle" id="btnSide" aria-label="메뉴 열기" aria-controls="side" aria-expanded="false"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <h1 class="brand-h"><a class="brand" href="#/"><span class="logo" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h9M8 12h10M6 18h8"/></svg></span><span class="pms-name">PMS</span></a></h1>
  <span class="crumb" id="crumb"></span>
  <span class="spacer"></span>
  <span id="userBox" class="userbox"></span>
  <button class="btn primary" id="btnUpload" data-need="editor">파일 업로드</button>
</header>
<div class="shell"><nav class="side" id="side" aria-label="주 메뉴"></nav>
<main id="view" tabindex="-1"></main></div>

<dialog id="dlgUpload">
  <form method="dialog" id="formUpload">
    <h3>공정표 올리기</h3>
    <p class="muted">Primavera P6 XER(.xer), MS Project(.mpp, .xml, .mpx), P6 XML 파일을 올리면 팀 전체가 결과를 공유합니다.</p>
    <label>파일<input type="file" name="file" accept=".xer,.xml,.mpp,.mpt,.mpx,.pms" required></label>
    <label>업로더 이름<input name="uploader" placeholder="예: 홍길동"></label>
    <label>메모<input name="note" placeholder="예: 3월 월간 업데이트"></label>
    <div class="row end">
      <button class="btn" value="cancel" formnovalidate>취소</button>
      <button class="btn primary" id="btnDoUpload" value="ok">올리고 분석</button>
    </div>
    <p class="err" id="uploadErr"></p>
  </form>
</dialog>

<dialog id="dlgToken">
  <form method="dialog">
    <h3>접근 토큰</h3>
    <p class="muted">관리자에게 받은 팀 접근 토큰을 입력하세요.</p>
    <input name="token" type="password" required>
    <div class="row end"><button class="btn primary" value="ok">확인</button></div>
  </form>
</dialog>
<div id="toast"></div>
<script defer src="/static/app.js"></script>
<script defer src="/static/ui.js"></script>
<script defer src="/static/ui2.js"></script>
<script defer src="/static/field.js"></script>

<script defer src="/static/app2.js"></script>
<script defer src="/static/app3.js"></script>

<script defer src="/static/app10.js"></script>
<script defer src="/static/app11.js"></script>
<script defer src="/static/app12.js"></script>
<script defer src="/static/app13.js"></script>
</body>
</html>
