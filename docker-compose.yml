services:
  scheduler:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      # 팀 접근 토큰 (비우면 인증 없음). 예: APP_TOKEN=my-team-secret
      APP_TOKEN: ${APP_TOKEN:-}
      MAX_UPLOAD_MB: "100"
      # 사용자 계정 (지정하면 첫 실행 때 관리자 생성 → 로그인 필수 모드)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SECURE_COOKIE: ${SECURE_COOKIE:-0}   # HTTPS 뒤에서 운영하면 1
      # AI 기능: 컨테이너 안에서 Claude CLI 를 쓰려면 CLI 설치·로그인 정보가 필요합니다.
      # 서버에 직접 설치해 실행(uvicorn)하는 방식을 권장하며, 컨테이너에서는 기본 off 입니다.
      AI_PROVIDER: ${AI_PROVIDER:-off}
      AI_MODEL: ${AI_MODEL:-}
    restart: unless-stopped
